[package]
name = "shiplist"
version = "0.1.0"
edition = "2024"
description = "Put every file in a repository in exactly one list, and remove each list before its build stage"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DocSpring/shiplist"
readme = "README.md"
keywords = ["docker", "ci", "dockerignore", "files", "build"]
categories = ["command-line-utilities", "development-tools::build-utils"]
exclude = [".github/"]

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
globset = "0.4.21"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.1"
serde_json = "1.0.154"
tar = "0.4.46"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
